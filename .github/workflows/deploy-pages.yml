
# Publishes GempaWatch to GitHub Pages as a fully static site.
#
# There is no server in this deployment, so the work Celery beat would do on a
# live VM happens here instead: spin up PostGIS, restore the accumulated event
# history, poll BMKG, re-sync recent USGS, recompute risk profiles, then freeze
# the whole read-only API into JSON files that ship alongside the frontend.
#
# The event history has to survive between runs because BMKG only exposes its
# last 15 events — anything older is only in our own database. Runners are
# ephemeral, so the database is carried across runs as a cached pg_dump. A cache
# miss is not fatal: the job falls back to a full USGS bootstrap and rebuilds
# from scratch, which makes the pipeline self-healing but slow (~10 min), so the
# cache is what keeps the normal run fast.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and routinely fires
    # late under load, so treat this as "roughly half-hourly", not a guarantee.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Scoped per job below rather than granted wholesale: only the build needs to
# write releases, and only the deploy needs to touch Pages.
permissions:
  contents: read

# Never publish two builds at once, but let a running publish finish rather
# than cancelling it — a half-deployed site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: gempawatch
  PGPASSWORD: gempawatch
  PGDATABASE: gempawatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write # publish monthly snapshot releases
      actions: read # list artifacts, to keep the daily backup to one per day
      pages: write
      id-token: write

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gempawatch
          POSTGRES_USER: gempawatch
          POSTGRES_PASSWORD: gempawatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gempawatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      # base.py reads these with no default, and evaluates before local.py can
      # override them, so they must be present even though nothing is served.
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: build-only-not-a-secret
      DATABASE_URL: postgis://gempawatch:gempawatch@localhost:5432/gempawatch
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev postgresql-client

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore accumulated event history
        id: db-cache
        uses: actions/cache@v4
        with:
          path: db-snapshot
          # Cache keys are immutable, so each run writes a new entry and picks
          # up the newest previous one via the prefix.
          key: gempawatch-db-${{ github.run_id }}
          restore-keys: |
            gempawatch-db-

      # Restore before migrating, into a database dropped and recreated first.
      # A data-only restore on top of a migrated database would collide on
      # Django's own tables (django_migrations, content types, permissions),
      # so the snapshot is treated as the whole database and migrate runs
      # afterwards to apply anything added since the snapshot was taken.
      - name: Restore cached database
        if: hashFiles('db-snapshot/snapshot.dump') != ''
        run: |
          echo "▸ restoring cached snapshot"
          psql -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS $PGDATABASE WITH (FORCE);" \
            -c "CREATE DATABASE $PGDATABASE OWNER $PGUSER;"
          pg_restore --no-owner --no-privileges -d "$PGDATABASE" \
            db-snapshot/snapshot.dump

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Bootstrap history on a cache miss
        if: hashFiles('db-snapshot/snapshot.dump') == ''
        working-directory: backend
        run: |
          echo "▸ no cached snapshot — running full USGS bootstrap"
          python manage.py earthquake_bootstrap

      - name: Report dataset size
        working-directory: backend
        run: |
          python manage.py shell -c "from apps.earthquakes.models import EarthquakeEvent; print('events in DB:', EarthquakeEvent.objects.count())"

      # Ahead of the refresh, so a region added to the GeoJSON gets its risk
      # profile computed in the same run rather than one publish later. The
      # restored snapshot only knows the regions that existed when it was taken,
      # so without this, editing admin_regions.geojson has no effect at all.
      - name: Load admin regions from GeoJSON
        working-directory: backend
        run: python manage.py load_regions

      - name: Refresh from BMKG and USGS
        working-directory: backend
        run: python manage.py refresh_for_export

      - name: Export the static API
        working-directory: backend
        run: |
          python manage.py export_static --out ./out
          python manage.py export_risk_fixtures --out ../frontend/src/lib/engine/__fixtures__

      - name: Stage the export for the frontend
        run: |
          # public/ holds nothing tracked, so it does not exist in a fresh
          # checkout — create it before copying into it.
          mkdir -p frontend/public
          rm -rf frontend/public/api frontend/public/data
          cp -r backend/out/api frontend/public/api
          cp -r backend/out/data frontend/public/data
          du -sh frontend/public/api frontend/public/data

      # Moved ahead of the build: it publishes the deployed site's base_url,
      # which the build needs to resolve absolute metadata URLs.
      - name: Resolve the Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The gate. Fixtures are regenerated from this run's data above, so this
      # asserts the TypeScript risk engine still reproduces Django's numbers on
      # the data actually about to be published — not on a stale snapshot. If it
      # fails, the site does not deploy, because the alternative is publishing
      # risk figures that disagree with our own stated methodology.
      - name: Verify the risk engine matches Django
        working-directory: frontend
        run: npm test

      - name: Build the static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # metadataBase falls back to http://localhost:3000 when this is unset,
          # which silently emits localhost URLs for every Open Graph image — so
          # shared links unfurl with an unreachable picture. This must be the
          # bare origin, not base_url: Next adds basePath to metadata assets
          # itself, and passing origin+path produces /gempawatch/gempawatch/...
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build:static

      - name: Save event history for the next run
        run: |
          mkdir -p db-snapshot
          # Full dump (schema included) so the next run can restore it wholesale.
          pg_dump -Fc -Z9 --no-owner --no-privileges \
            -d "$PGDATABASE" -f db-snapshot/snapshot.dump
          ls -lh db-snapshot/snapshot.dump

      # ---------------------------------------------------------------------
      # Backups.
      #
      # The Actions cache above is the working copy, not a backup: it holds the
      # only record of BMKG events older than the last 15 the feed exposes, and
      # a cache eviction or a manual cache purge would take it with no warning.
      # The fallback bootstrap rebuilds from USGS, which never recorded the
      # smaller felt quakes BMKG reports — so those would be gone for good.
      #
      # Two independent restore paths, on different storage with different
      # failure modes: a rolling daily artifact for recent recovery, and a
      # permanent monthly release for the long tail.
      #
      # Both are continue-on-error. A failed backup must never block a publish;
      # it is a problem for the next run to fix, not a reason to stop shipping
      # earthquake data.
      # ---------------------------------------------------------------------
      - name: Decide whether today's backup is already archived
        id: backup-gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs fire every ~30-90 minutes; one durable copy a day is plenty,
          # and uploading on every run would bury the Actions tab in artifacts.
          latest=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("db-backup-")) | select(.expired == false) | .created_at] | max // ""' \
            || echo "")
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ]; then
            echo "▸ no unexpired backup found — archiving"
            echo "archive=true" >> "$GITHUB_OUTPUT"
          else
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            # 20h rather than 24h so a day is never skipped by scheduler drift.
            if [ "$age" -ge 72000 ]; then
              echo "▸ newest backup is $((age / 3600))h old — archiving"
              echo "archive=true" >> "$GITHUB_OUTPUT"
            else
              echo "▸ newest backup is $((age / 3600))h old — skipping"
              echo "archive=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Archive the daily backup
        if: steps.backup-gate.outputs.archive == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.backup-gate.outputs.date }}
          path: db-snapshot/snapshot.dump
          retention-days: 90
          compression-level: 0 # pg_dump -Z9 already compressed it

      - name: Archive a monthly snapshot as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          tag="db-snapshot-$month"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "▸ $tag already archived"
            exit 0
          fi

          # Named by month so a downloaded file is self-describing once it is
          # sitting in someone's Downloads folder detached from its release.
          cp db-snapshot/snapshot.dump "gempawatch-db-$month.dump"

          # Releases, not a data-snapshots branch: git never forgets a blob, so
          # committing 8 MB a month would grow the clone by ~100 MB a year for
          # everyone, forever. Release assets live outside the object database
          # and cost cloners nothing.
          # Marked prerelease so a data dump never claims the "Latest release"
          # badge on the repository homepage. --latest=false alone is not
          # enough: GitHub resolves /releases/latest to the newest release that
          # is neither draft nor prerelease, so while these snapshots are the
          # only releases in the repo one of them takes the badge regardless.
          # Prereleases are excluded from that lookup unconditionally.
          gh release create "$tag" "gempawatch-db-$month.dump" \
            --title "Database snapshot — $month" \
            --latest=false \
            --prerelease \
            --notes "Full \`pg_dump -Fc\` of the GempaWatch database, taken $(date -u +%Y-%m-%dT%H:%M:%SZ) from run ${{ github.run_id }}.

          Restore with:

          \`\`\`
          createdb gempawatch
          psql -d gempawatch -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          pg_restore --no-owner --no-privileges -d gempawatch gempawatch-db-$month.dump
          \`\`\`

          See README → Data durability for the full recovery procedure."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
